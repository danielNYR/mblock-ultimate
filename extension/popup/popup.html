<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../options/common.css">
  <style>
    body { width: 280px; padding: 14px; }
    .host { font-weight: 600; word-break: break-all; margin: 4px 0 12px; }
    .stats { display: flex; gap: 8px; margin: 12px 0; }
    .stat { flex: 1; background: var(--card); border-radius: 8px; padding: 8px; text-align: center; }
    .stat b { display: block; font-size: 20px; }
    button { width: 100%; margin-top: 6px; }
    .phantom { background: var(--card); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px; margin: 10px 0 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h1 class="brand"><img src="../icons/icon-32.png" alt="" width="24" height="24"> MBlock Ultimate</h1>
  <div class="muted">Sitio actual</div>
  <div class="host" id="host">—</div>
  <label class="switch"><input type="checkbox" id="siteToggle"> Protección activa en este sitio</label>
  <div class="muted" id="trustedNote" hidden>Este sitio es un dominio seguro: no se vigilan sus popups ni redirecciones.</div>
  <div class="phantom" id="phantom" hidden>👻 <b>Sesión fantasma</b>: <span id="phantomReason"></span>.
    Las cookies de este sitio se borrarán al cerrar la pestaña.</div>
  <div class="muted" id="cookies"></div>
  <div class="stats">
    <div class="stat"><b id="tabCount">0</b>en esta página</div>
    <div class="stat"><b id="total">0</b>en total</div>
  </div>
  <button id="addTrusted">Marcar sitio como dominio seguro</button>
  <button id="options" class="secondary">Opciones</button>
  <script src="popup.js"></script>
</body>
</html>
