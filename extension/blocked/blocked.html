<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página bloqueada · MBlock Ultimate</title>
  <link rel="stylesheet" href="../options/common.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
    main { max-width: 560px; width: 100%; }
    h1 { font-size: 24px; }
    .url { font: 13px ui-monospace, monospace; background: var(--card); padding: 10px; border-radius: 6px; word-break: break-all; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
    dt { color: var(--muted); }
    dd { margin: 0; word-break: break-all; font-family: ui-monospace, monospace; }
    .row { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  </style>
</head>
<body>
<main>
  <h1 class="brand"><img src="../icons/icon-64.png" alt="" width="40" height="40"> Página bloqueada</h1>
  <p>MBlock Ultimate impidió abrir esta dirección porque aparece en una de tus listas de filtros
    (anuncios, rastreo, malware o phishing).</p>
  <div class="url" id="url"></div>
  <dl>
    <dt>Filtro</dt><dd id="rule"></dd>
    <dt>Lista</dt><dd id="list"></dd>
  </dl>
  <div class="row">
    <button id="back">Volver a un lugar seguro</button>
    <button id="proceed" class="secondary">Continuar de todas formas</button>
  </div>
  <p class="muted">«Continuar» desactiva esta advertencia para el sitio hasta que reinicies Firefox.</p>
</main>
<script src="blocked.js"></script>
</body>
</html>
