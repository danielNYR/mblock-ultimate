name: Sitio roto
description: Un sitio deja de funcionar con la extensión activada
labels: [sitio-roto]
body:
  - type: input
    id: url
    attributes:
      label: Dirección de la página
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué deja de funcionar?
      description: ¿Se arregla al desactivar la protección en ese sitio desde el botón de la extensión?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de la extensión y de Firefox
    validations:
      required: true
