# Al publicar una etiqueta vX.Y.Z: prueba, empaqueta, firma en AMO (canal
# "unlisted", si existen los secretos AMO_JWT_ISSUER / AMO_JWT_SECRET) y
# adjunta el .zip y el .xpi firmado a la release de GitHub.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: La etiqueta coincide con la versión del manifest
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Etiqueta $GITHUB_REF_NAME ≠ manifest v$v"; exit 1; }
      - run: npm test
      - run: npm run lint -- --warnings-as-errors
      - run: npm run build
      - name: Firmar en addons.mozilla.org (unlisted)
        if: env.AMO_JWT_ISSUER != ''
        run: >
          npx --yes web-ext@10 sign --source-dir extension --artifacts-dir dist
          --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
