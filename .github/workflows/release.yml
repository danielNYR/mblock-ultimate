# Publicación de una versión. Se dispara al subir una etiqueta vX.Y.Z (solo el
# mantenedor puede crearlas) o manualmente desde la pestaña Actions.
#   1. Verifica que la etiqueta coincide con el manifest y pasa todos los controles.
#   2. Empaqueta la extensión (.zip) y la adjunta a la release de GitHub.
#   3. Si existen los secretos AMO_JWT_ISSUER / AMO_JWT_SECRET, la envía a
#      addons.mozilla.org: canal "listed" (ficha pública, pasa revisión de Mozilla)
#      o "unlisted" (solo firma, para distribuir el .xpi tú mismo).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal de addons.mozilla.org"
        type: choice
        options: [listed, unlisted]
        default: listed

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      CHANNEL: ${{ inputs.channel || 'listed' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: La etiqueta coincide con la versión del manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Etiqueta $GITHUB_REF_NAME ≠ manifest v$v"; exit 1; }
      - run: npm ci
      - run: npm run coverage
      - run: npm run lint
      - run: npm run check-lists
      - run: npm run build
      - name: Ficha y notas de la versión para AMO
        run: node scripts/amo-metadata.mjs
      - name: Enviar a addons.mozilla.org
        if: env.AMO_JWT_ISSUER != ''
        run: >
          npx --yes web-ext@10.7.0 sign --source-dir extension --artifacts-dir dist
          --channel "$CHANNEL" --amo-metadata dist/amo-metadata.json --approval-timeout 0
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.xpi
          fail_on_unmatched_files: false
          generate_release_notes: true
