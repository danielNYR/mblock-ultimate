# Análisis de seguridad y calidad de GitHub (CodeQL) sobre el JavaScript de la
# extensión y sobre los propios workflows. Las alertas altas bloquean la fusión.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
